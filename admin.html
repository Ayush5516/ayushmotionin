<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Ayush Motion Edits</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0a0a0a;
      color: #ededed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 20px;
    }
    #login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
    }
    .login-card {
      background: #141414;
      border: 1px solid #262626;
      border-radius: 12px;
      padding: 32px 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }
    .login-card h2 { color: #eab308; font-size: 22px; margin-bottom: 8px; }
    .login-card p { color: #737373; font-size: 13px; margin-bottom: 20px; }
    .input-field {
      width: 100%;
      padding: 12px 14px;
      background: #000;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      outline: none;
      margin-bottom: 14px;
    }
    .input-field:focus { border-color: #eab308; }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: #eab308;
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-submit:active { background: #ca8a04; }
    #error-message {
      color: #ef4444;
      font-size: 13px;
      margin-top: 14px;
      display: none;
    }
    #dashboard-container {
      display: none;
      max-width: 900px;
      margin: 0 auto;
      padding-top: 20px;
    }
    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    .dash-title { color: #eab308; font-size: 22px; font-weight: 700; }
    .badge {
      background: #22c55e15;
      color: #22c55e;
      border: 1px solid #22c55e40;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
    }
    .orders-grid { display: grid; gap: 16px; }
    .order-card {
      background: #141414;
      border: 1px solid #262626;
      border-radius: 12px;
      padding: 20px;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #202020;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .client-name { color: #fff; font-size: 17px; font-weight: 600; }
    .time-stamp { color: #737373; font-size: 12px; }
    .info-row { display: flex; margin-bottom: 8px; font-size: 14px; }
    .info-label { width: 120px; color: #888; }
    .info-value { color: #e5e5e5; flex: 1; word-break: break-all; }
    .btn-link {
      display: inline-block;
      margin-top: 12px;
      padding: 8px 16px;
      background: #eab308;
      color: #000;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <!-- Login Form -->
  <div id="login-container">
    <div class="login-card">
      <h2>Ayush Motion Admin</h2>
      <p>Enter secret password to view submissions</p>
      
      <form id="admin-login-form" onsubmit="event.preventDefault(); doLogin();">
        <input 
          type="password" 
          id="password-input" 
          class="input-field" 
          placeholder="Enter Admin Password" 
          required
        />
        <button type="submit" id="login-btn" class="btn-submit">Login</button>
      </form>
      <p id="error-message">Incorrect password. Access denied.</p>
    </div>
  </div>

  <!-- Protected Admin Dashboard -->
  <div id="dashboard-container">
    <div class="dash-header">
      <div class="dash-title">Client Bookings Dashboard</div>
      <div class="badge">● Live Listening</div>
    </div>

    <div id="orders-list" class="orders-grid">
      <p id="status-text" style="color: #737373;">Loading submissions...</p>
    </div>
  </div>

  <script>
    const CORRECT_PIN = "Ahlshit2@wiwjs6djs";
    const SUPABASE_URL = "https://gjervmutftnxngmflaeb.supabase.co";
    const SUPABASE_KEY = "sb_publishable_ITcvNTJ7S3Fi862UF7lXNg_82juhqa8";

    function doLogin() {
      const inputEl = document.getElementById("password-input");
      const errorEl = document.getElementById("error-message");
      const val = inputEl.value.trim();

      if (val === CORRECT_PIN) {
        errorEl.style.display = "none";
        document.getElementById("login-container").style.display = "none";
        document.getElementById("dashboard-container").style.display = "block";
        initDashboard();
      } else {
        errorEl.style.display = "block";
        inputEl.style.borderColor = "#ef4444";
      }
    }

    async function initDashboard() {
      const ordersList = document.getElementById("orders-list");

      try {
        if (!window.supabase) {
          ordersList.innerHTML = "<p style='color:#ef4444;'>Supabase library not loaded. Check internet.</p>";
          return;
        }

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Fetch bookings
        const { data, error } = await supabase
          .from("bookings")
          .select("*")
          .order("id", { ascending: false });

        if (error) {
          ordersList.innerHTML = `<p style="color:#ef4444;">Database error: ${error.message}</p>`;
          return;
        }

        ordersList.innerHTML = "";
        if (!data || data.length === 0) {
          ordersList.innerHTML = "<p style='color:#737373;'>No project submissions found yet.</p>";
          return;
        }

        data.forEach(item => addCard(item));

        // Realtime
        supabase
          .channel("realtime-bookings")
          .on("postgres_changes", { event: "INSERT", schema: "public", table: "bookings" }, payload => {
            addCard(payload.new, true);
          })
          .subscribe();

      } catch (err) {
        ordersList.innerHTML = `<p style="color:#ef4444;">Error: ${err.message}</p>`;
      }
    }

    function addCard(item, isNew = false) {
      const ordersList = document.getElementById("orders-list");
      const card = document.createElement("div");
      card.className = "order-card";
      if (isNew) card.style.borderColor = "#22c55e";

      const formattedDate = item.created_at 
        ? new Date(item.created_at).toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" }) 
        : "N/A";

      card.innerHTML = `
        <div class="card-top">
          <div class="client-name">${item.client_name || "Unknown Client"}</div>
          <div class="time-stamp">${formattedDate}</div>
        </div>
        <div class="info-row">
          <span class="info-label">Brand / Client:</span>
          <span class="info-value">${item.brand || "—"}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Package:</span>
          <span class="info-value">${item.package || "—"}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Timeline / Brief:</span>
          <span class="info-value">${item.timeline || "—"}</span>
        </div>
        ${item.project_url ? `
          <div style="margin-top: 10px;">
            <a href="${item.project_url}" target="_blank" rel="noopener noreferrer" class="btn-link">
              Open Project Assets ↗
            </a>
          </div>
        ` : ""}
      `;

      ordersList.prepend(card);
    }
  </script>
</body>
</html>
